services:
  backend:
    build: ./backend
    environment:
      RSSHUNTER_DB: /app/data/rsshunter.db
      RSSHUNTER_FETCH_INTERVAL_SECONDS: 900
      RSSHUNTER_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - rsshunter_data:/app/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  rsshunter_data:
