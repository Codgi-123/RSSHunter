services:
  backend:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RSSHUNTER_DB: /app/data/rsshunter.db
      RSSHUNTER_FETCH_INTERVAL_SECONDS: 900
      RSSHUNTER_CORS_ORIGINS: http://localhost:4000,http://127.0.0.1:4000
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - rsshunter_data:/app/data
    ports:
      - "9000:9000"
  frontend:
    build: ./frontend
    ports:
      - "4000:4000"
    depends_on:
      - backend
volumes:
  rsshunter_data:
